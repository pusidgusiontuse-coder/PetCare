image: python:3.12-slim
stages: [test]
services:
  - name: postgres:17
    alias: postgres
test:
  stage: test
  variables:
    SECRET_KEY: 'ci-only-key-at-least-32-characters-do-not-use-in-production'
    POSTGRES_USER: petcare
    POSTGRES_PASSWORD: ci-only-password
    POSTGRES_DB: petcare_test
    DATABASE_URL: 'postgresql+psycopg://petcare:ci-only-password@postgres:5432/petcare_test'
    TEST_DATABASE_URL: 'postgresql+psycopg://petcare:ci-only-password@postgres:5432/petcare_test'
    ENABLE_DEMO_LOGIN: 'true'
  script:
    - pip install -r app/requirements.txt
    - python -m pytest app/test_security_features.py app/test_main.py app/test_database_migration.py -q
