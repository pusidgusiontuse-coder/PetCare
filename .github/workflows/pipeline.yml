name: PetCare CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-key-at-least-32-characters-do-not-use-in-production
      DATABASE_URL: sqlite:////tmp/petcare-ci.db
      ENABLE_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r app/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app
      - run: python -m pytest app/test_security_features.py app/test_main.py -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          if-no-files-found: ignore
  ui:
    name: Interface (desktop and mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-key-at-least-32-characters-do-not-use-in-production
      DATABASE_URL: sqlite:////tmp/petcare-ui.db
      ENABLE_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt -r tests/requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check interface
        run: |
          python -m uvicorn main:app --app-dir app --port 8002 > /tmp/petcare-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/petcare-ui.log' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8002/api/v1/health; then ready=true; break; fi
            sleep 1
          done
          $ready
          python tests/ux_browser.py
          python tests/forms_browser.py
          python tests/wheels_browser.py
          python tests/usability_browser.py
      - name: Upload interface diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-diagnostics
          path: |
            reports/ui/
            /tmp/petcare-ui.log
            /tmp/petcare-*.png
          if-no-files-found: ignore
          retention-days: 7
