name: PetCare CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-key-at-least-32-characters-do-not-use-in-production
      DATABASE_URL: sqlite:////tmp/petcare-ci.db
      ENABLE_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r app/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app
      - run: python -m pytest app/test_security_features.py app/test_main.py -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          if-no-files-found: ignore
