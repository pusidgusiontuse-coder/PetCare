name: PetCare CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: petcare
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: petcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petcare -d petcare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-at-least-32-characters-do-not-use-in-production
      DATABASE_URL: postgresql+psycopg://petcare:ci-only-password@127.0.0.1:5432/petcare_test
      TEST_DATABASE_URL: postgresql+psycopg://petcare:ci-only-password@127.0.0.1:5432/petcare_test
      ENABLE_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r app/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app
      - run: python -m alembic upgrade head
      - run: python -m pytest app/test_security_features.py app/test_main.py app/test_database_migration.py -q --junitxml=reports/pytest.xml
      - run: python -m alembic check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          if-no-files-found: ignore
  ui:
    name: Interface (desktop and mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: petcare
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: petcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petcare -d petcare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-at-least-32-characters-do-not-use-in-production
      DATABASE_URL: postgresql+psycopg://petcare:ci-only-password@127.0.0.1:5432/petcare_test
      ENABLE_DEMO_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt -r tests/requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m alembic upgrade head
      - name: Check interface
        run: |
          python -m uvicorn main:app --app-dir app --port 8002 > /tmp/petcare-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/petcare-ui.log' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8002/api/v1/health; then ready=true; break; fi
            sleep 1
          done
          $ready
          python tests/ux_browser.py
          python tests/forms_browser.py
          python tests/wheels_browser.py
          python tests/usability_browser.py
          python tests/hierarchy_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: app/static/frontend/
          if-no-files-found: error
          retention-days: 7
      - name: Upload interface diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-diagnostics
          path: |
            reports/ui/
            /tmp/petcare-ui.log
            /tmp/petcare-*.png
          if-no-files-found: ignore
          retention-days: 7
